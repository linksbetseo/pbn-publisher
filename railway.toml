[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm ci && npm run build && cp -r dist ../backend/frontend_dist && cd ../backend && pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
